<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>私人测试面单生成器</title><style>body{margin:0;background:#f3f5f8;color:#17202c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.wrap{max-width:600px;margin:auto;padding:18px 16px 45px}h1{font-size:23px;margin:5px 0 6px}.hint{font-size:13px;color:#64748b;line-height:1.7;margin:0 0 18px}.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 3px 18px #0b1b3310;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,textarea{box-sizing:border-box;width:100%;border:1px solid #d6deea;border-radius:9px;padding:11px;font-size:16px;background:#fff}textarea{resize:vertical;min-height:64px}button{border:0;border-radius:10px;background:#1565d8;color:#fff;font-size:16px;font-weight:650;padding:14px;cursor:pointer;width:100%;margin-top:10px}.secondary{background:#e8efff;color:#1555ad}.preview{width:100%;height:auto;border:1px solid #d4dbe6;display:block;box-sizing:border-box;background:white}.foot{font-size:12px;color:#64748b;line-height:1.7}.tag{color:#b42318;font-weight:700}</style></head><body><div class="wrap"><h1>📦 私人测试面单生成器</h1><p class="hint">按参考图片的 <b>3:4 比例（960×1280）</b> 制作。所有内容在本机生成，不上传服务器。仅供演示、内部测试，不是真实快递凭证。</p><div class="card"><div class="field"><label>自定义测试编号（数字或大写字母）</label><input id="num" value="TEST20038" maxlength="24"></div><div class="grid"><div class="field"><label>收件人</label><input id="to" value="张三"></div><div class="field"><label>收件电话</label><input id="toPhone" value="138****8888"></div></div><div class="field"><label>收件地址</label><textarea id="toAddr">广东省深圳市宝安区测试路88号</textarea></div><div class="grid"><div class="field"><label>寄件人</label><input id="from" value="测试仓库"></div><div class="field"><label>寄件电话</label><input id="fromPhone" value="136****6666"></div></div><div class="field"><label>寄件地址</label><textarea id="fromAddr">广东省广州市测试区演示街1号</textarea></div><div class="field"><label>分拣编码</label><input id="sort" value="651 A03 08A"></div><button id="draw">生成测试面单</button><button id="save" class="secondary">保存 PNG 图片</button></div><div class="card"><canvas class="preview" id="paper" width="960" height="1280"></canvas><p class="foot"><span class="tag">测试面单 · 非真实运单</span><br>iPhone 点击“保存 PNG 图片”后，可在预览界面长按图片保存到照片；如浏览器直接下载，请到“文件”App 的下载项查看。</p></div></div><script>
const $=id=>document.getElementById(id),c=$('paper'),ctx=c.getContext('2d');
function text(t,x,y,size=32,bold=false,align='left'){ctx.fillStyle='#111';ctx.font=`${bold?'bold ':''}${size}px -apple-system, 'PingFang SC',sans-serif`;ctx.textAlign=align;ctx.fillText(String(t),x,y)}
function line(y){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(42,y);ctx.lineTo(918,y);ctx.stroke()}
function wrap(s,x,y,maxWidth,size=29,lh=42,maxLines=3){ctx.font=`${size}px -apple-system, 'PingFang SC',sans-serif`;let rows=[],cur='';for(const ch of String(s)){if(ctx.measureText(cur+ch).width>maxWidth&&cur){rows.push(cur);cur=ch}else cur+=ch}if(cur)rows.push(cur);rows.slice(0,maxLines).forEach((r,i)=>text(r,x,y+i*lh,size));}
// Code 39: valid, scan-readable symbology for demonstration IDs only.
const patterns={"0":"101001101101","1":"110100101011","2":"101100101011","3":"110110010101","4":"101001101011","5":"110100110101","6":"101100110101","7":"101001011011","8":"110100101101","9":"101100101101","A":"110101001011","B":"101101001011","C":"110110100101","D":"101011001011","E":"110101100101","F":"101101100101","G":"101010011011","H":"110101001101","I":"101101001101","J":"101011001101","K":"110101010011","L":"101101010011","M":"110110101001","N":"101011010011","O":"110101101001","P":"101101101001","Q":"101010110011","R":"110101011001","S":"101101011001","T":"101011011001","U":"110010101011","V":"100110101011","W":"110011010101","X":"100101101011","Y":"110010110101","Z":"100110110101","-":"100101011011",".":"110010101101"," ":"100110101101","$":"100100100101","/":"100100101001","+":"100101001001","%":"101001001001","*":"100101101101"};
function barcode(value,x,y,w,h){let v='*'+value+'*',bits='';for(let i=0;i<v.length;i++){bits+=patterns[v[i]]+'0'}let unit=Math.min(4,w/bits.length),left=x+(w-bits.length*unit)/2;ctx.fillStyle='#111';for(let i=0;i<bits.length;i++)if(bits[i]==='1')ctx.fillRect(left+i*unit,y,Math.max(1,unit),h)}
function render(){let id=$('num').value.toUpperCase().replace(/[^0-9A-Z .\-$\/+%]/g,'').slice(0,24)||'TEST20038';$('num').value=id;ctx.fillStyle='#fff';ctx.fillRect(0,0,960,1280);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(26,26,908,1228);text('测试电子面单',48,96,56,true);text('DEMO ONLY',910,92,30,true,'right');line(120);text('分拣编码',48,170,26);text($('sort').value||'—',48,245,62,true);line(280);text('收',48,351,48,true);text($('to').value,140,350,38,true);text($('toPhone').value,520,350,32);wrap($('toAddr').value,140,405,740,32,45,3);line(545);text('寄',48,606,44,true);text($('from').value,140,603,32,true);text($('fromPhone').value,520,603,29);wrap($('fromAddr').value,140,654,740,28,40,2);line(765);text('内部测试编号',48,815,27);barcode(id,55,845,850,165);text(id,480,1065,42,true,'center');line(1100);text('仅供测试 · 不可寄件 · 不可用于物流查询',480,1160,28,true,'center');ctx.save();ctx.translate(480,680);ctx.rotate(-Math.PI/5);ctx.textAlign='center';ctx.font='bold 116px sans-serif';ctx.fillStyle='rgba(190,0,0,.12)';ctx.fillText('测试面单',0,0);ctx.restore();}
$('draw').onclick=render;$('save').onclick=()=>{render();c.toBlob(blob=>{let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='测试面单-'+$('num').value+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')};render();
</script></body></html>
